<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet"  href="./style.css">
    <title>Music page</title>
</head>
<body>
    <header>
        <h1>Most listend to:</h1>
    </header>

<nav class="navbar" style="background-color: #698167;" data-bs-theme="light">
  <div class="container-fluid">
    <a class="navbar-brand"></a>
    <form class="d-flex" role="search">
      <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
    </form>
    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
  <button class="btn btn-primary me-md-2" type="button">
    <img src="./Images/Profile.jpg" alt="Button Image" style="width:50px; height:50px" class ="Profile-picture">
  </button>

  </div>
</nav>


    <main id="menu1">
        <section id="artists">
            <h2>Artists</h2>
            <img class="artist-icon" src="./Images/Declan McKenna.png">
            <p>Declan McKenna</p>
            <img class="artist-icon" src="./Images/Harry.png">
            <p>Harry Styles</p>
            <img class="artist-icon" src="./Images/Rhianna.png">
            <p>Rhianna</p>
            <img class="artist-icon" src="./Images/Eminem.png">
            <p>Eminem</p>
        </section>
        <section id="songs">
            <h2>Songs</h2>
            <article>
                <p>Till I Get There - Lupe Fiasco</p>
                <p>Life is a Highway - Rascal Flatts</p>
                <p>Landslide - Fleetwood Mac</p>
            </article>
        </section>
        <section id="playlists">
            <h2>Playlists</h2>
            <img class="playlist-icon" src="./Images/AM.png">
            <p>AM</p>
            <img class="playlist-icon" src="./Images/Help.png">
            <p>Help!</p>
            <img class="playlist-icon" src="./Images/StoneRoses.png">
            <p>The Stone Roses</p>
            <img class="playlist-icon" src="./Images/Queen II.png">
            <p>Queen II</p>
            <img class="playlist-icon" src="./Images/Divide.png">
            <p>Divide</p>
            <img class="playlist-icon" src="./Images/Rewind.png">
            <p>These Streets</p>
        </section>
    </main>
    <main id="menu2">
        <p>Focus Mode</p>
    </main>
    <main id="menu3">
        <img id="song-icon" src="./Images/Brazil.png">
        <p>Brazil - Declan McKenna</p>
        <p id="start-time">00:00</p>
        <p id="end-time">03:35</p>
        <img class="buttons" src="./Images/rewind - Copy.png">
        <img class="buttons" src="./Images/play-button-arrowhead.png">
        <img class="buttons" src="./Images/fast-forward.png">
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
